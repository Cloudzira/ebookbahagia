<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Bahagia Tanpa Syarat</title>
<style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:760px;margin:0 auto;padding:20px;line-height:1.6}section{border:1px solid #8884;border-radius:12px;padding:16px;margin:16px 0}h1{font-size:22px}h2{font-size:17px;margin:0 0 10px}
input,textarea,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #8886;background:Canvas;color:CanvasText}button{cursor:pointer;background:#2f7f7a;color:#fff;border:0}button.s{background:none;color:inherit;border:1px solid #8886;padding:4px 10px;font-size:13px}
textarea{width:100%;min-height:110px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{font-size:13px;display:block}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid #8884}code{font-size:12.5px}#msg{min-height:22px;font-size:14px}</style></head><body>
<h1>Admin · Bahagia Tanpa Syarat</h1><div id="msg" role="status"></div>
<section id="in"><button id="gi">Masuk dengan Google</button></section>
<div id="app" hidden>
<section><h2>1. Unggah konten premium</h2><p style="font-size:14px">Pilih file <b>konten-premium.json</b> dari komputermu (jangan diletakkan di folder website).</p><div class="row"><input type="file" id="pf" accept=".json"><button id="up">Unggah</button></div></section>
<section><h2>2. Buat kode aktivasi</h2><div class="row"><div><label>Jumlah</label><input id="n" type="number" value="10" min="1" max="200" style="width:90px"></div><div><label>Maks. perangkat</label><input id="mx" type="number" value="3" min="1" max="10" style="width:90px"></div><div style="flex:1"><label>Catatan (opsional)</label><input id="nt" placeholder="mis. batch Shopee" style="width:100%"></div><button id="mk">Buat</button></div><textarea id="out" readonly placeholder="Kode baru muncul di sini"></textarea><button class="s" id="cp">Salin semua</button></section>
<section><h2>3. Daftar kode</h2><button id="ld">Muat daftar</button> <span id="cnt"></span><table id="tb"></table></section></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDocs,collection,deleteDoc,updateDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ADMIN='awanproject54@gmail.com'; /* harus sama dengan email di aturan Firestore */
const app=initializeApp({apiKey:"AIzaSyDFY-06c_YSA3mJaw5m8TYEs61ieOLo56o",authDomain:"ebook-4a0b4.firebaseapp.com",projectId:"ebook-4a0b4",storageBucket:"ebook-4a0b4.firebasestorage.app",messagingSenderId:"638679900387",appId:"1:638679900387:web:46e3a03e8d7676e9b625d6"}),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),say=t=>$('#msg').textContent=t,esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789',gen=()=>{const c=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>AL[x%AL.length]);return 'BTS-'+[0,4,8].map(i=>c.slice(i,i+4).join('')).join('-')};
$('#gi').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>say('Gagal masuk: '+e.code));
onAuthStateChanged(auth,u=>{const ok=u&&!u.isAnonymous&&u.email===ADMIN;$('#app').hidden=!ok;$('#in').hidden=ok;say(ok?'Masuk sebagai '+u.email:u&&!u.isAnonymous?'Akun '+u.email+' bukan admin.':'')});
$('#up').onclick=async()=>{const f=$('#pf').files[0];if(!f)return say('Pilih file konten-premium.json dulu.');try{const t=await f.text(),j=JSON.parse(t);if(t.length>900000)return say('File terlalu besar (maks. sekitar 900 KB).');await setDoc(doc(db,'content','bts'),{json:JSON.stringify(j),updatedAt:serverTimestamp()});say('Konten premium terunggah: '+Object.keys(j).length+' bab.')}catch(e){say('Gagal unggah: '+(e.code||e.message))}};
$('#mk').onclick=async()=>{const n=Math.min(200,Math.max(1,+$('#n').value||1)),mx=Math.min(10,Math.max(1,+$('#mx').value||3)),nt=$('#nt').value.trim(),b=writeBatch(db),ks=[];for(let i=0;i<n;i++){const k=gen();ks.push(k);b.set(doc(db,'licenses',k),{max:mx,uids:[],note:nt,createdAt:serverTimestamp()})}try{await b.commit();$('#out').value=ks.join('\n');say(n+' kode dibuat.')}catch(e){say('Gagal membuat kode: '+(e.code||e.message))}};
$('#cp').onclick=()=>{navigator.clipboard.writeText($('#out').value);say('Tersalin.')};
async function load(){try{const s=await getDocs(collection(db,'licenses'));let h='<tr><th>Kode</th><th>Catatan</th><th>Perangkat</th><th></th></tr>';s.forEach(d=>{const x=d.data();h+=`<tr><td><code>${esc(d.id)}</code></td><td>${esc(x.note)}</td><td>${(x.uids||[]).length}/${x.max}</td><td><button class="s" data-r="${esc(d.id)}">Reset</button> <button class="s" data-d="${esc(d.id)}">Cabut</button></td></tr>`});$('#tb').innerHTML=h;$('#cnt').textContent=s.size+' kode'}catch(e){say('Gagal memuat: '+(e.code||e.message))}}
$('#ld').onclick=load;
$('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.r){await updateDoc(doc(db,'licenses',b.dataset.r),{uids:[]});say('Perangkat direset.')}else if(b.dataset.d&&confirm('Cabut kode ini? Pembeli kehilangan akses.')){await deleteDoc(doc(db,'licenses',b.dataset.d));say('Kode dicabut.')}load()}catch(x){say('Gagal: '+(x.code||x.message))}};
</script></body></html>

<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ambil kode aktivasi · Bahagia Tanpa Syarat</title>
<style>
:root{--bg:#faf5f4;--fg:#2b2224;--mut:#6b5c5f;--ac:#a4545f;--on:#fff;--card:#fff;--ln:#e5d6d8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1c1618;--fg:#f0e6e7;--mut:#b6a6a9;--ac:#d99aa2;--on:#2a1519;--card:#271e21;--ln:#3d2e32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 40px}
main{max-width:440px;margin:6vh auto 0}h1{font:600 28px/1.25 Georgia,'Times New Roman',serif;margin:0 0 8px}
p{margin:0 0 18px;color:var(--mut)}label{display:block;font-size:14px;margin:14px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--fg)}
button,a.b{display:inline-block;font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--on);cursor:pointer;text-decoration:none}
button.o,a.o{background:none;color:var(--ac)}button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#f button{margin-top:18px;width:100%}#m{min-height:24px;margin:14px 0 0;font-size:14.5px}#m.e{color:#c0392b}@media(prefers-color-scheme:dark){#m.e{color:#ff8a7a}}
#r{margin-top:22px;padding:20px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
#r code{display:block;font:600 22px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;word-break:break-all;margin:6px 0 16px}
#r .row{display:flex;gap:10px;flex-wrap:wrap}#r small{display:block;margin-top:14px;color:var(--mut)}
</style></head><body><main>
<h1>Ambil kode aktivasi</h1>
<p>Masukkan email yang kamu pakai saat membayar. Ebook langsung terbuka.</p>
<form id="f" autocomplete="off"><label for="e">Email pembelian</label><input id="e" type="email" required autocomplete="email" inputmode="email">
<button id="go">Buka ebook</button></form>
<div id="m" role="status"></div>
<section id="r" hidden aria-live="polite"><div>Berhasil. Membuka ebook...</div><code id="c"></code>
<div class="row"><a class="b" id="bk" href="/">Buka ebook sekarang</a></div>
<small>Ini kode aktivasimu, simpan untuk jaga-jaga. Untuk membaca di perangkat lain, buka halaman ini lagi dan isi email yang sama.</small></section>
</main>
<script>
const EBOOK_URL='/'; /* ganti bila ebook ada di alamat lain */
const $=s=>document.querySelector(s),m=$('#m'),ERR={notfound:'Pembayaran dengan email ini belum ditemukan. Periksa penulisan email. Jika baru saja membayar, tunggu 1-2 menit lalu coba lagi.',revoked:'Kode untuk pesanan ini sudah dicabut. Hubungi penjual.',busy:'Sedang diproses. Coba lagi sebentar.',bad:'Isi email dengan benar.'};
$('#f').onsubmit=async ev=>{ev.preventDefault();const b=$('#go');b.disabled=true;m.className='';m.textContent='Memeriksa pesanan...';$('#r').hidden=true;
try{const r=await fetch('/api/klaim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#e').value})}),j=await r.json().catch(()=>({}));
if(r.ok&&j.code){$('#c').textContent=j.code;$('#r').hidden=false;m.textContent='';$('#bk').href=EBOOK_URL+'?kode='+encodeURIComponent(j.code);setTimeout(()=>location.href=$('#bk').href,1200)}
else{m.className='e';m.textContent=ERR[j.error]||'Terjadi gangguan. Coba lagi sebentar lagi.'}}
catch(x){m.className='e';m.textContent='Tidak ada koneksi internet. Coba lagi saat online.'}
b.disabled=false};
</script></body></html>
